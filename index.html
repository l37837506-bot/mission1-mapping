<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#eaf0fb">
  <meta name="apple-mobile-web-app-title" content="극한환경 탐사">
  <title>극한환경 탐사 미션 · 정찰 매핑</title>

  <!-- Pretendard (dynamic subset: 실제 쓰인 글자만 내려받아 현장 대역폭 부담이 적음) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <style>
    :root {
      /* 관제실 계열 — 어두운 금속 패널 + 경고 황색 */
      --text:        #e8edf5;
      --text-dim:    #9fb0c7;
      --text-faint:  #74869e;
      --accent:      #fbbf24;   /* 경고 황색 */
      --danger:      #f43f5e;
      --ok:          #22c55e;

      --panel:       #171b23;   /* 패널 면 */
      --panel-hi:    #1f2530;   /* 밝은 면 */
      --panel-lo:    #10131a;   /* 깊은 홈 */
      --line:        rgba(148, 170, 200, 0.16);
      --line-hi:     rgba(190, 210, 240, 0.30);
      --shadow:      0 10px 30px rgba(0, 0, 0, 0.45);
      --shadow-lg:   0 26px 60px rgba(0, 0, 0, 0.62);

      /* 황흑 경고 줄무늬 — 실물 판넬과 같은 언어 */
      --hazard: repeating-linear-gradient(45deg,
                  #f5c518 0 9px, #16181d 9px 18px);

      --radius: 12px;
      --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
              'Apple SD Gothic Neo', system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    /* 모든 글자 크기는 rem이라, 루트만 키우면 UI 전체가 함께 커진다.
       학생은 태블릿을 책상에 놓고 팔 길이에서 보므로 폰보다 크게 잡는다. */
    html {
      background: #0b0d12;
      font-size: 16px;
    }
    @media (min-width: 700px)  { html { font-size: 19px; } }
    @media (min-width: 1000px) { html { font-size: 20px; } }
    body {
      margin: 0; padding: 0;
      font-family: var(--sans);
      color: var(--text);
      background: transparent;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    img, svg { -webkit-user-drag: none; user-drag: none; }

    /* ---------- 배경: 금속 플레이트 + 미세 격자 ---------- */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background:
        radial-gradient(120% 80% at 50% -10%, #1c2331 0%, transparent 60%),
        linear-gradient(180deg, #0e1118 0%, #0b0d12 100%);
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(120, 150, 190, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120, 150, 190, 0.05) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(80% 60% at 50% 20%, #000 0%, transparent 85%);
      -webkit-mask-image: radial-gradient(80% 60% at 50% 20%, #000 0%, transparent 85%);
    }
    /* 상·하단 경고 띠 */
    .bg::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px;
      background: var(--hazard); opacity: 0.85;
    }

    #root { min-height: 100vh; position: relative; z-index: 1; }

    /* ---------- 패널 ---------- */
    .glass {
      position: relative;
      background: linear-gradient(160deg, var(--panel-hi), var(--panel));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    /* 패널 모서리 리벳 */
    .glass::before, .glass::after {
      content: ''; position: absolute; top: 7px; width: 4px; height: 4px;
      border-radius: 50%; background: rgba(190, 210, 240, 0.22);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    }
    .glass::before { left: 7px; }
    .glass::after  { right: 7px; }

    .glass-strong {
      background: linear-gradient(165deg, #222834, #14181f);
      border: 1px solid var(--line-hi);
      border-radius: 14px;
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    /* 지도는 밝은 도면 그대로 — 관제 모니터처럼 베젤을 두른다 */
    .screen {
      background: #e9eef7;
      border: 1px solid rgba(0,0,0,0.5);
      border-radius: 9px;
      box-shadow: inset 0 0 0 3px #0d1017, inset 0 3px 14px rgba(0,0,0,0.35);
      padding: 9px;
    }
    .hazard-rule { height: 5px; border-radius: 3px; background: var(--hazard); opacity: 0.9; }

    /* ---------- 타이포 ---------- */
    h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
    .eyebrow {
      font-family: var(--mono); font-size: 0.6562rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent); font-weight: 700;
    }
    .dim   { color: var(--text-dim); }
    .faint { color: var(--text-faint); }
    .mono  { font-family: var(--mono); }

    /* ---------- 터치 리플 ---------- */
    .ripple { position: relative; overflow: hidden; }
    .ripple-wave {
      position: absolute; border-radius: 50%;
      background: currentColor; opacity: 0.26;
      transform: scale(0); pointer-events: none;
      animation: rippleOut 0.62s var(--ease) forwards;
    }
    @keyframes rippleOut { to { transform: scale(2.4); opacity: 0; } }

    /* ---------- 버튼 ---------- */
    button { font-family: inherit; color: inherit; cursor: pointer; transition: transform .16s var(--ease), background .2s, border-color .2s, box-shadow .2s; }
    button:active:not(:disabled) { transform: scale(0.96); }
    button:disabled { cursor: default; }

    .btn-glass {
      background: linear-gradient(165deg, #262d3a, #191e27);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 0.625rem 0.9375rem; font-size: 0.8125rem; font-weight: 700; color: var(--text-dim);
    }
    .btn-glass:hover:not(:disabled) { border-color: var(--line-hi); color: var(--text); }

    .btn-primary {
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 10px;
      background: linear-gradient(165deg, #3a3320, #24201a);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      color: var(--accent); font-weight: 800; letter-spacing: 0.02em;
    }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(165deg, #483f26, #2b261d); }
    .btn-primary:disabled { opacity: 0.5; box-shadow: none; }

    /* 팀 타일 */
    .team-tile {
      padding: 1.5rem 0.35rem; border-radius: 10px;
      border: 1px solid var(--line-hi);
      background: linear-gradient(165deg, #232a36, #151920);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      font-size: 1.4375rem; font-weight: 800; color: var(--team);
      font-family: var(--mono);
      text-shadow: 0 0 14px var(--team-glow);
    }
    .team-tile::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: var(--team); opacity: 0.85;
    }
    .team-tile:hover { transform: translateY(-2px); border-color: var(--team); }

    .chip {
      padding: 0.44rem 0.875rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
      border: 1px solid var(--line); background: #1b212b; color: var(--text-dim);
      font-family: var(--mono);
    }
    .chip-on { border-color: var(--accent); color: #0d1017; background: var(--accent); }

    .ico-row { display: flex; align-items: center; gap: 8px; }
    .legend-dot {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 7px rgba(49, 73, 122, 0.22);
    }

    /* 세그먼트 탭 */
    .prop-picked { animation: pickPulse 1.5s ease-in-out infinite; }
    @keyframes pickPulse { 0%,100% { opacity: .85; } 50% { opacity: .3; } }
    .move-bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 260; display: flex; align-items: center; gap: 9px;
      pointer-events: none;
      padding: 10px 12px 10px 15px; border-radius: 10px;
      font-size: 0.75rem; font-weight: 700; color: var(--text);
      background: linear-gradient(165deg, #242b38, #14181f);
      border: 1px solid var(--accent);
      box-shadow: 0 12px 34px rgba(0,0,0,0.6);
    }
    .move-bar button { pointer-events: auto; padding: 7px 12px; border-radius: 7px; font-size: 0.6875rem; font-weight: 700; border: 1px solid var(--line); background: #1b212b; color: var(--text-dim); }
    .move-bar button.danger { color: var(--danger); border-color: rgba(244,63,94,0.4); }

    /* 소품 팔레트 · 드래그 */
    .tray { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .tray-chip {
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      width: 5.1rem; padding: 8px 4px 7px; border-radius: 9px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, #222936, #161b23);
      font-size: 0.625rem; font-weight: 700; color: var(--text-dim);
      cursor: grab; text-align: center; line-height: 1.25;
      transition: transform .16s var(--ease), opacity .2s, border-color .2s;
    }
    .tray-chip:active { cursor: grabbing; transform: scale(0.94); }
    .tray-chip:hover:not(.done) { border-color: var(--line-hi); }
    .tray-chip.done { opacity: 0.42; cursor: default; }
    .tray-chip.done .tray-mark { opacity: 0.7; box-shadow: none; }
    .tray-mark {
      width: 2.15rem; height: 2.15rem; display: flex; align-items: center; justify-content: center;
      color: #fff; box-shadow: 0 4px 12px rgba(49,73,122,0.22);
    }
    .tray-mark.hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border-radius: 3px; }
    .tray-mark.sq  { border-radius: 11px; }
    /* 차폐 저장고는 바닥 구역이라 납작한 구획 모양으로 */
    .tray-mark.pad {
      width: 3rem; height: 1.6rem; border-radius: 5px;
      background: rgba(250, 204, 21, 0.22) !important;
      border: 2px dashed #facc15; box-shadow: none;
    }
    .drag-ghost {
      position: fixed; z-index: 400; pointer-events: none;
      transform: translate(-50%, -50%); opacity: 0.92;
      filter: drop-shadow(0 8px 18px rgba(23,35,59,0.4));
    }
    .drop-hint {
      position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
      border: 2px dashed rgba(99,102,241,0.75); background: rgba(99,102,241,0.07);
    }

    /* 팀 비교 대시보드 */
    .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
    .board-card { padding: 11px 11px 9px; }
    .board-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .board-dot {
      width: 1.35rem; height: 1.35rem; border-radius: 5px; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 0.6875rem; font-weight: 800; color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .board-name { font-size: 0.7812rem; font-weight: 700; flex: 1; }
    .board-count { font-family: var(--mono); font-size: 0.7188rem; color: var(--text-dim); font-weight: 600; }
    .board-bar { background: #0c0f15; height: 4px; border-radius: 2px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--line); }
    .board-bar > div { height: 100%; transition: width .3s var(--ease); }
    .board-found { display: flex; gap: 9px; margin-top: 7px; font-size: 0.6875rem; color: var(--text-dim); font-weight: 600; }
    .board-found span { display: flex; align-items: center; gap: 3px; }
    .board-empty { font-size: 0.6875rem; color: var(--text-faint); margin-top: 7px; text-align: center; }

    .seg {
      flex: 1; padding: 0.8125rem 0.625rem; border-radius: 9px; font-size: 0.8125rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, #222936, #161b23);
      color: var(--text-dim);
    }
    .seg-on {
      border-color: var(--accent); color: var(--accent);
      background: linear-gradient(165deg, #33301f, #201d17);
      box-shadow: inset 0 0 0 1px rgba(250,204,21,0.18);
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 700;
      color: var(--text-dim); letter-spacing: 0.03em;
    }
    .field input {
      width: 100%; padding: 0.8125rem 0.9375rem;
      border-radius: 8px; border: 1px solid var(--line);
      background: #0c0f15; color: var(--accent);
      font-family: var(--mono); font-weight: 800; letter-spacing: 0.04em;
      font-size: 1rem !important;   /* iOS 자동 확대 방지 */
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      text-align: right;
    }
    .field input::placeholder { color: #46536b; font-weight: 600; letter-spacing: 0; }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 0 3px rgba(250,204,21,0.12); }

    .check {
      display: flex; align-items: center; gap: 11px;
      padding: 0.8125rem 0.9375rem; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--line); background: #161b23;
      font-size: 0.9375rem; font-weight: 600; color: var(--text-dim);
      margin-bottom: 9px;
    }
    .check input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); flex: none; }
    .check-on { border-color: var(--accent); color: var(--text); background: #23200f; }

    .progress {
      background: #0c0f15; border-radius: 3px; overflow: hidden;
      border: 1px solid var(--line);
    }
    .progress-fill { height: 100%; transition: width .35s var(--ease); }
    .progress-fill.on { box-shadow: 0 0 10px var(--team-glow, rgba(250,204,21,0.5)); }

    .loading { padding: 96px 20px; text-align: center; color: var(--text-dim); font-size: 0.875rem; font-family: var(--mono); }
    .loading-spinner {
      display: inline-block; width: 34px; height: 34px; margin-bottom: 14px;
      border: 3px solid rgba(148,170,200,0.18); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .build-tag {
      position: fixed; right: 8px; bottom: 5px; z-index: 300;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
      color: var(--text-faint); opacity: 0.5; pointer-events: none;
    }
    .conn-indicator {
      position: fixed; top: 10px; right: 10px; z-index: 300;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 11px; border-radius: 6px;
      font-family: var(--mono); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .conn-err { background: #2a1116; color: #fb7185; border: 1px solid rgba(244,63,94,0.45); }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    /* 관제 상태 표시줄 */
    .status-row { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.08em; color: var(--text-faint); }
    .status-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
    .status-bars i { width: 3px; background: var(--ok); border-radius: 1px; display: block; }

    .pin { animation: pop .44s var(--ease) both; transition: transform .18s var(--ease); transform-box: fill-box; transform-origin: center; }
    .pin:active { transform: scale(0.9); }
    /* 정복한 구역: 또렷하게 빛난다 */
    .pin-won { filter: drop-shadow(0 0 9px var(--won-glow, rgba(99,102,241,0.8))) drop-shadow(0 3px 6px rgba(23,35,59,0.28)); }
    /* 미방문 구역: 안개 속 — 원반만 흐리고 구역 이름은 선명하게 남긴다.
       탭해서 입력하는 건 그대로 된다 */
    /* 그룹 opacity는 등장 애니메이션(pop, fill:both)이 덮어쓰므로 자식에만 건다 */
    .pin-fog .pin-body { filter: blur(2.2px) saturate(0.6) opacity(0.85); }
    /* 흐려진 원반 위에서도 구역 이름이 읽히도록 흰 후광을 두른다.
       stroke를 먼저 칠해야(paint-order) 글자 획이 후광에 먹히지 않는다 */
    .pin-fog text {
      opacity: 1;
      paint-order: stroke;
      stroke: rgba(255,255,255,0.95);   /* 지도는 밝은 도면이라 흰 후광 유지 */
      stroke-width: 3.5px;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      .rise, .pop, .zoom, .fade, .pin, .conn-indicator { animation: none !important; }
      .blob { animation: none !important; }
      .progress-fill::after { animation: none; }
      .progress-fill { transition: none; }
    }
  </style>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
</head>
<body>
  <div class="bg">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
  </div>

  <div id="root">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>앱 로딩 중...</div>
    </div>
  </div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    // ============ 설정 ============
    const DATABASE_URL = 'https://mission1-mapping-default-rtdb.firebaseio.com';
    const DB_PATH = 'mission1_v1';
    const POLL_INTERVAL = 3000;  // 3초마다 데이터 갱신

    const EMPTY_PIN = '#cbd5e1';                  // 히트맵에서 값 없는 구역
    const WHITE_PIN = 'rgba(255,255,255,0.95)';   // 미입력 구역
    const HEAT = ['#22c55e', '#f97316', '#ef4444'];  // 방사선 범례 색 (IAEA OIL 3단계)
    const DARK_LABEL_ON = [EMPTY_PIN, '#eab308']; // 밝은 핀 위에는 어두운 글자

    // ============ 아이콘 ============
    // 24x24 그리드 기준 벡터 패스. currentColor를 쓰므로 부모의 color를 따라간다.
    // HTML 버튼(<Icon/>)과 지도 위 배지(<MapIcon/>) 양쪽에서 같은 패스를 재사용.
    const STROKE = { fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };

    // 방사선 삼엽(trefoil): 중심원 + 60° 블레이드 3개를 120°씩 회전
    const TREFOIL_BLADE = 'M9.75 8.1 6.75 2.91a10.5 10.5 0 0 1 10.5 0L14.25 8.1a4.5 4.5 0 0 0-4.5 0Z';

    const ICONS = {
      // 현수교: 상판 + 주탑 2개 + 처진 주케이블 + 측면 케이블
      bridge: (
        <g {...STROKE}>
          <path d="M2 17h20" />
          <path d="M6.5 17V5.5M17.5 17V5.5" />
          <path d="M6.5 5.5c2 7.5 9 7.5 11 0" />

    // ============ Firebase REST API 헬퍼 ============
    const api = {
      async getAll() {
        const res = await fetch(`${DATABASE_URL}/${DB_PATH}.json`);
        if (!res.ok) throw new Error('DB 읽기 실패: ' + res.status);
        return (await res.json()) || {};
      },
      async setZone(teamId, zoneCode, value) {
        const url = `${DATABASE_URL}/${DB_PATH}/${teamId}/${encodeURIComponent(zoneCode)}.json`;
        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(value),
        });
        if (!res.ok) throw new Error('저장 실패: ' + res.status);
        return await res.json();
      },
      // 소품은 markers/ 아래에 둔다. 팀 노드에 넣으면 진행률이
      // Object.keys(data[teamId]).length 라서 구역 수로 잘못 세어진다.
      async setMarker(teamId, propId, value) {
        const url = `${DATABASE_URL}/${DB_PATH}/markers/${teamId}/${propId}.json`;
        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(value),
        });
        if (!res.ok) throw new Error('배치 저장 실패: ' + res.status);
        return await res.json();
      },
      async deleteMarker(teamId, propId) {
        const url = `${DATABASE_URL}/${DB_PATH}/markers/${teamId}/${propId}.json`;
        const res = await fetch(url, { method: 'DELETE' });
        if (!res.ok) throw new Error('배치 삭제 실패: ' + res.status);
      },
      async deleteAll() {
        const res = await fetch(`${DATABASE_URL}/${DB_PATH}.json`, { method: 'DELETE' });
        if (!res.ok) throw new Error('삭제 실패: ' + res.status);
      },
    };

    // Firebase 스트림은 전체가 아니라 바뀐 경로만 보낸다.
    //   put   → 그 경로를 통째로 교체 (data === null 이면 삭제)
    //   patch → 그 경로에 키만 병합
    // path는 "/", "/1", "/1/α1" 같은 형태.
    const applyStreamPatch = (prev, path, data, merge) => {
      const parts = String(path || '/').split('/').filter(Boolean);
      if (parts.length === 0) {
        if (data === null || data === undefined) return {};
        return merge ? { ...prev, ...data } : data;
      }
      const next = { ...prev };
      let cur = next;
      for (let i = 0; i < parts.length - 1; i++) {
        const k = parts[i];
        cur[k] = (cur[k] && typeof cur[k] === 'object') ? { ...cur[k] } : {};
        cur = cur[k];
      }
      const last = parts[parts.length - 1];
      if (data === null || data === undefined) delete cur[last];
      else if (merge && cur[last] && typeof cur[last] === 'object' && typeof data === 'object') {
        cur[last] = { ...cur[last], ...data };
      } else {
        cur[last] = data;
      }
      return next;
    };

    // 운영 중 원전의 구역 표지 기준(미국 NRC 10 CFR 20, 국제 통용) 3단계 (mSv/h):
    //   < 0.05  초록 — 일반 구역 수준. 정상
    //   0.05~1  주황 — Radiation Area(방사선구역). 이상 징후, 체류시간 관리
    //   >= 1    빨강 — High Radiation Area(고방사선구역). 누설 의심, 로봇 전용
    // 컨셉: 발전소에 경미한 이상 발생 -> 사람 대신 로봇이 선행 점검
    const getRadiationColor = (value) => {
      if (value === null || value === undefined || value === '') return null;
      const v = parseFloat(value);
      if (isNaN(v)) return null;
      if (v < 0.05) return '#22c55e';
      if (v < 1) return '#f97316';
      return '#ef4444';
    };

    // ============ 라우팅 ============
    const parseHash = () => {
      const h = window.location.hash.slice(1);
      if (h.startsWith('/team/')) {
        const id = parseInt(h.slice(6), 10);
        // 팀 수를 TEAMS에서 가져온다. 상수로 박아두면 팀을 늘렸을 때
        // 주소가 조용히 홈으로 떨어진다.
        if (TEAMS.some(t => t.id === id)) return { view: 'team', teamId: id };
      }
      if (h === '/admin') return { view: 'admin' };
      return { view: 'home' };
    };
    const navigate = (route) => { window.location.hash = route; };

    // ============ 지도 ============
    const FloorMap = ({ zoneData, onZoneClick, selectedZone, heatmapMode = false, teamId = null,
                       landmarksMode = false, compact = false, uid = 'map',
                       markers = null, movingProp = null, onMarkerTap = null, onMapTap = null }) => {
      // 팀 화면·팀 필터는 그 팀 기준, 전체 보기는 아무 팀이나 입력했으면 정복
      const isVisited = (code) => teamId
        ? !!zoneData[teamId]?.[code]
        : TEAMS.some(t => !!zoneData[t.id]?.[code]);
      // 구역 방사선량: 팀 화면은 그 팀 값, 전체 보기는 팀 평균
      const zoneRadiation = (code) => {
        const ids = teamId ? [teamId] : TEAMS.map(t => t.id);
        const vals = [];
        ids.forEach(id => {
          const v = zoneData[id]?.[code]?.radiation;
          if (v !== undefined && v !== null && v !== '') {
            const f = parseFloat(v);
            if (!isNaN(f)) vals.push(f);
          }
        });
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      const getPinFill = (zone, visited) => {
        const avg = zoneRadiation(zone.code);
        if (heatmapMode) return avg === null ? EMPTY_PIN : getRadiationColor(avg);
        if (!visited) return WHITE_PIN;
        if (avg !== null) return getRadiationColor(avg);
        // 저장은 했지만 방사선량을 비워둔 경우
        if (landmarksMode) return zone.color;
        const team = TEAMS.find(t => t.id === teamId);
        return team ? team.color : zone.color;
      };
      const zoneWithBridge = (code) => TEAMS.some(t => zoneData[t.id]?.[code]?.bridge);
      const zoneWithCapsule = (code) => TEAMS.some(t => zoneData[t.id]?.[code]?.capsule);
      return (
        <svg viewBox="0 0 900 900" style={{ width: '100%', maxWidth: compact ? 'none' : '780px', height: 'auto', display: 'block', margin: '0 auto' }}>
          <CleanFloorPlan uid={uid} simple={compact} />
          {/* 점령 영역: 각 핀의 전용 셀(ZONE_CELLS)만 방사선 색으로 칠한다.
              셀들이 지도를 빈틈없이 타일링하므로 자기 구역은 꽉 차되
              이웃 구역은 침범하지 않고, 마스크가 복도 밖을 잘라낸다 */}
          <g mask={`url(#${uid}-corridorMask)`} filter={`url(#${uid}-zoneSpread)`} style={{ pointerEvents: 'none' }}>
            {ZONES.map(zone => {
              if (!isVisited(zone.code)) return null;
              const avg = zoneRadiation(zone.code);
              const noReading = avg === null;
              return (
                <polygon key={zone.code} points={ZONE_CELLS[zone.code]}
                         fill={noReading ? '#e2e8f0' : getRadiationColor(avg)}
                         opacity={noReading ? 0.45 : 0.8} />
              );
            })}
          </g>
          <HomeBase compact={compact} />
          {ZONES.map((zone, i) => {
            const isSelected = selectedZone === zone.code;
            const visited = isVisited(zone.code);
            const pinFill = getPinFill(zone, visited);
            const r = isSelected ? 23 : 21;
            // 강사 랜드마크 모드: 전체 팀 / 팀 화면: 자기 팀이 체크한 것만
            const teamMode = !heatmapMode && !landmarksMode && !!teamId;
            const ownEntry = teamId ? zoneData[teamId]?.[zone.code] : null;
            const hasBridge = landmarksMode ? zoneWithBridge(zone.code) : (teamMode && !!ownEntry?.bridge);
            const hasCapsule = landmarksMode ? zoneWithCapsule(zone.code) : (teamMode && !!ownEntry?.capsule);
            // 팀 화면은 우상단이 체크 배지 자리라 캡슐을 우하단으로 내린다
            const capY = landmarksMode ? zone.y - r * 0.8 : zone.y + r * 0.85;
            const labelFill = pinFill === WHITE_PIN ? zone.color
                            : DARK_LABEL_ON.includes(pinFill) ? '#334155' : '#fff';
            return (
              <g key={zone.code} className={'pin ' + (visited ? 'pin-won' : 'pin-fog')}
                 style={{ cursor: onZoneClick ? 'pointer' : 'default', animationDelay: `${i * 35}ms`, '--won-glow': visited ? pinFill : undefined }}
                 onClick={() => onZoneClick && onZoneClick(zone.code)}>
                {/* 선택 시 확산 링 */}
                {isSelected && <circle cx={zone.x} cy={zone.y} r={r + 13} fill="none" stroke="#6366f1" strokeWidth="2.5" opacity="0.55" />}
                {/* 원반(그림자+원+반사)만 pin-body — 안개 블러가 글자를 건드리지 않게 분리 */}
                <g className="pin-body">
                  <ellipse cx={zone.x + 1} cy={zone.y + 6} rx={r + 2} ry={(r + 2) * 0.3} fill="rgba(23,35,59,0.28)" />
                  <circle cx={zone.x} cy={zone.y} r={r} fill={pinFill} />
                  <ellipse cx={zone.x} cy={zone.y - r * 0.44} rx={r * 0.58} ry={r * 0.28} fill="rgba(255,255,255,0.38)" style={{ pointerEvents: 'none' }} />
                </g>
                {!compact && (
                  <text x={zone.x} y={zone.y + 6} textAnchor="middle" fontSize="16" fontWeight="bold"
                        fill={labelFill} style={{ pointerEvents: 'none' }}>
                    {zone.code}
                  </text>
                )}
                {visited && !heatmapMode && !landmarksMode && !compact && (
                  <g style={{ pointerEvents: 'none' }}>
                    <circle cx={zone.x + r * 0.7} cy={zone.y - r * 0.7} r="11" fill="#10b981" stroke="#fff" strokeWidth="2.5" />
                    <MapIcon name="check" cx={zone.x + r * 0.7} cy={zone.y - r * 0.7} size={14} color="#fff" />
                  </g>
                )}
                {hasBridge && (
                  <g style={{ pointerEvents: 'none' }}>
                    <circle cx={zone.x - r * 0.7} cy={zone.y - r * 0.8} r={compact ? 27 : 17.5} fill="#1f2937" stroke="#fff" strokeWidth={compact ? 4 : 2.5} />
                    <MapIcon name="bridge" cx={zone.x - r * 0.7} cy={zone.y - r * 0.8} size={compact ? 35 : 23} color="#fff" />
                  </g>
                )}
                {hasCapsule && (
                  <g style={{ pointerEvents: 'none' }}>
                    <circle cx={zone.x + r * 0.7} cy={capY} r={compact ? 27 : 17.5} fill="#f59e0b" stroke="#fff" strokeWidth={compact ? 4 : 2.5} />
                    <MapIcon name="capsule" cx={zone.x + r * 0.7} cy={capY} size={compact ? 35 : 23} color="#fff" />
                  </g>
                )}
              </g>
            );
          })}
          {/* 배치된 소품 — 핀 위에 얹는다 */}
          {markers && Object.keys(markers).map(id => {
            const m = markers[id];
            if (!m || typeof m.x !== 'number' || typeof m.y !== 'number') return null;
            const prop = propById(id);
            if (!prop) return null;
            const picked = movingProp === id;
            const rr = compact ? 31 : 20;
            return (
              <g key={id} style={{ cursor: onMarkerTap ? 'pointer' : 'default' }}>
                {picked && (
                  <circle cx={m.x} cy={m.y} r={rr + 13} fill="none"
                          stroke="#6366f1" strokeWidth="4" opacity="0.85" className="prop-picked" />
                )}
                <PropToken type={prop.type} x={m.x} y={m.y} r={rr} dim={!!movingProp && !picked} compact={compact} />
                {/* 토큰 그림은 pointer-events:none 이므로 잡을 면을 따로 깐다.
                    손가락으로도 편하도록 토큰보다 조금 넉넉하게 */}
                {onMarkerTap && (prop.type === 'shield'
                  ? <rect x={m.x - rr * 2.1} y={m.y - rr * 1.4} width={rr * 4.2} height={rr * 2.8}
                          fill="#fff" fillOpacity="0.001"
                          style={{ pointerEvents: 'all', touchAction: 'manipulation' }}
                          onClick={(e) => { e.stopPropagation(); onMarkerTap(id); }} />
                  : <circle cx={m.x} cy={m.y} r={rr + 10} fill="#fff" fillOpacity="0.001"
                            style={{ pointerEvents: 'all', touchAction: 'manipulation' }}
                            onClick={(e) => { e.stopPropagation(); onMarkerTap(id); }} />
                )}
              </g>
            );
          })}
          {/* 옮기는 중에는 지도 전체가 '놓을 자리' 입력을 받는다.
              핀 클릭이 가로채지 않도록 맨 위에 투명 판을 덮는다 */}
          {movingProp && onMapTap && (
            <rect x="0" y="0" width="900" height="900" fill="#fff" fillOpacity="0.001"
                  style={{ cursor: 'crosshair', pointerEvents: 'all' }}
                  onClick={(e) => {
                    const svg = e.currentTarget.ownerSVGElement;
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX; pt.y = e.clientY;
                    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
                    onMapTap(q.x, q.y);
                  }} />
          )}
        </svg>
      );
    };

    // ============ 입력 폼 ============
    const InputForm = ({ zone, currentData, onSave, onClose }) => {
      const zoneInfo = ZONES.find(z => z.code === zone);
      const [radiation, setRadiation] = useState(currentData?.radiation || '');
      const [temp, setTemp] = useState(currentData?.temp || '');
      const [humidity, setHumidity] = useState(currentData?.humidity || '');
      const [bridge, setBridge] = useState(currentData?.bridge || false);
      const [capsule, setCapsule] = useState(currentData?.capsule || false);
      const [saving, setSaving] = useState(false);

      const handleSave = async () => {
        setSaving(true);
        try {
          await onSave({ radiation, temp, humidity, bridge, capsule, timestamp: Date.now() });
          onClose();
        } catch (e) {
          alert('저장 실패: ' + e.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fade" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
             style={{ position: 'fixed', inset: 0, background: 'rgba(120, 140, 180, 0.32)', WebkitBackdropFilter: 'blur(14px)', backdropFilter: 'blur(14px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: '16px' }}>
          <div className="glass-strong zoom" style={{ padding: '24px', maxWidth: '420px', width: '100%', maxHeight: '90vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '20px' }}>
              <div className="mono" style={{ width: '58px', height: '58px', flexShrink: 0, borderRadius: '19px', background: `linear-gradient(150deg, ${zoneInfo.color}, ${zoneInfo.color}bb)`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.1875rem', fontWeight: 800, color: 'white', boxShadow: `0 10px 24px ${zoneInfo.color}55, inset 0 1px 0 rgba(255,255,255,0.5)` }}>{zone}</div>
              <div>
                <div className="eyebrow" style={{ marginBottom: '3px' }}>Zone Record</div>
                <h2 style={{ fontSize: '1.1875rem' }}>구역 {zone}</h2>
                <p className="faint" style={{ margin: '2px 0 0', fontSize: '0.7812rem' }}>{zoneInfo.desc}</p>
              </div>
            </div>

            {zoneInfo.unstable && (
              <div style={{ background: 'rgba(254, 243, 199, 0.8)', border: '1px solid rgba(245, 158, 11, 0.45)', borderRadius: '13px', padding: '11px 14px', marginBottom: '16px', fontSize: '0.7812rem', color: '#92400e', fontWeight: 500, display: 'flex', alignItems: 'center', gap: '9px' }}>
                <Icon name="warning" size={17} />
                <span>통신 불안정 구역 — FPV 화면이 흔들릴 수 있음</span>
              </div>
            )}

            <div className="field">
              <label>방사선량 (mSv/h)</label>
              <input type="number" step="0.1" value={radiation} onChange={(e) => setRadiation(e.target.value)} placeholder="예: 0.03" />
            </div>
            <div className="field">
              <label>온도 (°C)</label>
              <input type="number" value={temp} onChange={(e) => setTemp(e.target.value)} placeholder="예: 45" />
            </div>
            <div className="field">
              <label>습도 (%)</label>
              <input type="number" value={humidity} onChange={(e) => setHumidity(e.target.value)} placeholder="예: 60" />
            </div>

            <div style={{ borderTop: '1px solid var(--edge-soft)', paddingTop: '16px', marginTop: '6px' }}>
              <p className="faint" style={{ margin: '0 0 11px', fontSize: '0.7188rem', fontWeight: 700 }}>이 구역에서 발견한 것 (해당 시 체크)</p>
              <label className={bridge ? 'check check-on ripple' : 'check ripple'} style={{ marginBottom: '9px' }}>
                <input type="checkbox" checked={bridge} onChange={(e) => setBridge(e.target.checked)} />
                <span className="ico-row" style={{ color: bridge ? '#4338ca' : 'var(--text-dim)' }}>
                  <Icon name="bridge" size={19} /><span style={{ color: 'var(--text)' }}>교량 발견</span>
                </span>
              </label>
              <label className={capsule ? 'check check-on ripple' : 'check ripple'}>
                <input type="checkbox" checked={capsule} onChange={(e) => setCapsule(e.target.checked)} />
                <span className="ico-row" style={{ color: capsule ? '#4338ca' : 'var(--text-dim)' }}>
                  <Icon name="capsule" size={19} /><span style={{ color: 'var(--text)' }}>캡슐 발견</span>
                </span>
              </label>
            </div>

            <div style={{ display: 'flex', gap: '10px', marginTop: '22px' }}>
              <button className="btn-glass ripple" onClick={onClose} disabled={saving} style={{ flex: 1, padding: '14px' }}>취소</button>
              <button className="btn-primary ripple" onClick={handleSave} disabled={saving} style={{ flex: 2, padding: '14px', fontSize: '0.875rem' }}>
                {saving ? '저장 중...' : '저장'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============ 팀 뷰 ============
    const TeamView = ({ teamId, data, onSave, onBack, onPlaceProp, onRemoveProp }) => {
      const [selectedZone, setSelectedZone] = useState(null);
      const [drag, setDrag] = useState(null);      // 팔레트에서 끌어오는 중
      const [moving, setMoving] = useState(null); // 배치된 소품을 탭해 옮기는 중
      const mapRef = useRef(null);
      const team = TEAMS.find(t => t.id === teamId);
      const teamData = data[teamId] || {};
      const markers = (data.markers && data.markers[teamId]) || {};

      const beginDrag = (e, id) => {
        const prop = propById(id);
        if (!prop) return;
        e.preventDefault();
        setDrag({ id, type: prop.type, cx: e.clientX, cy: e.clientY });
      };

      // 드래그는 포인터 이벤트로 직접 처리한다. HTML5 drag&drop은
      // iOS 사파리 터치에서 아예 발생하지 않아 태블릿에서 쓸 수 없다.
      useEffect(() => {
        if (!drag) return;
        const move = (e) => setDrag(d => d && ({ ...d, cx: e.clientX, cy: e.clientY }));
        const finish = (e) => {
          const svg = mapRef.current && mapRef.current.querySelector('svg');
          const box = svg && svg.getBoundingClientRect();
          const inside = box && e.clientX >= box.left && e.clientX <= box.right
                             && e.clientY >= box.top  && e.clientY <= box.bottom;
          if (svg && inside) {
            const pt = svg.createSVGPoint();
            pt.x = e.clientX; pt.y = e.clientY;
            const q = pt.matrixTransform(svg.getScreenCTM().inverse());
            // 건물 원 밖으로 나가면 테두리 안쪽으로 끌어당긴다
            let x = q.x, y = q.y;
            const dx = x - 450, dy = y - 450, d = Math.hypot(dx, dy), LIM = 404;
            if (d > LIM) { x = 450 + dx / d * LIM; y = 450 + dy / d * LIM; }
            onPlaceProp(drag.id, Math.round(x), Math.round(y));
          }
          setDrag(null);            // 지도 밖에 놓으면 그냥 취소
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', finish);
        window.addEventListener('pointercancel', () => setDrag(null));
        return () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', finish);
        };
      }, [drag, onPlaceProp, onRemoveProp]);

      const completedCount = Object.keys(teamData).length;
      const pct = (completedCount / ZONES.length) * 100;
      return (
        <div style={{ padding: '18px 16px 36px', maxWidth: '840px', margin: '0 auto' }}>
          <div className="glass rise" style={{ padding: '16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <button className="btn-glass ripple" onClick={onBack} style={{ flexShrink: 0, padding: '10px 13px' }}>←</button>
              <div className="mono" style={{ width: '46px', height: '46px', flexShrink: 0, borderRadius: '15px', background: `linear-gradient(150deg, ${team.color}, ${team.deep})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '1.125rem', color: 'white', boxShadow: `0 8px 20px ${team.color}66, inset 0 1px 0 rgba(255,255,255,0.5)` }}>{teamId}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="eyebrow">Recon Log</div>
                <h2 style={{ fontSize: '1.0625rem' }}>{team.name} · 정찰 기록</h2>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0, lineHeight: 1.1 }}>
                <span className="mono" style={{ fontSize: '1.5625rem', fontWeight: 800, color: team.deep }}>{completedCount}</span>
                <span className="faint mono" style={{ fontSize: '0.8125rem' }}> / {ZONES.length}</span>
              </div>
            </div>

                        onMapTap={(x, y) => {
                          // 건물 외곽 밖이면 테두리 안쪽으로 당긴다
                          const dx = x - 450, dy = y - 450, d = Math.hypot(dx, dy), LIM = 404;
                          if (d > LIM) { x = 450 + dx / d * LIM; y = 450 + dy / d * LIM; }
                          onPlaceProp(moving, Math.round(x), Math.round(y));
                          setMoving(null);

            <div className="fade" style={{ marginTop: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '0.6875rem' }}>

          </div>

          <div className="glass rise" style={{ padding: '13px 12px 11px', marginTop: '14px', animationDelay: '.14s' }}>

                  <div key={prop.id}
                       className={placed ? 'tray-chip done' : 'tray-chip'}

                    <div className={'tray-mark ' + (prop.type === 'obstacle' ? 'hex' : prop.type === 'shield' ? 'pad' : 'sq')}

                      <Icon name={prop.type} size={19} />
                    </div>
                    <span>{prop.name}</span>
                  </div>

              })}
            </div>
            <p className="faint" style={{ margin: '9px 0 0', fontSize: '0.625rem', textAlign: 'center' }}>
              잘못 놓았다면 지도에서 해당 표시를 탭한 뒤 옮길 자리를 다시 탭하세요
            </p>
          </div>

          {moving && (
            <div className="move-bar">
              <span>{propById(moving) && propById(moving).name} — 옮길 자리를 탭하세요</span>
              <button className="ripple" onClick={() => setMoving(null)}>취소</button>

          {drag && (

    // ============ 강사 뷰 ============
    const AdminView = ({ data, onBack, onReset }) => {
      const [mode, setMode] = useState('heatmap');
      // 교량·캡슐 모드에서는 전 팀이 배치한 소품을 한 지도에 겹쳐 본다

                <div key={team.id} style={{ marginBottom: '12px' }}>

                    <div className="mono" style={{ width: '24px', height: '24px', borderRadius: '8px', background: `linear-gradient(150deg, ${team.color}, ${team.deep})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.6875rem', fontWeight: 800, color: '#fff', boxShadow: `0 3px 9px ${team.color}55` }}>{team.id}</div>
                    <span style={{ flex: 1, fontSize: '0.8125rem', fontWeight: 500 }}>{team.name}</span>

                  </div>
                  <div className="progress" style={{ height: '7px' }}>

                  </div>

            })}
          </div>

          <div className="rise" style={{ display: 'flex', gap: '9px', marginBottom: '12px', animationDelay: '.12s' }}>
            <button className={mode === 'heatmap' ? 'seg seg-on ripple' : 'seg ripple'} onClick={() => setMode('heatmap')}>

            </button>
            <button className={mode === 'landmarks' ? 'seg seg-on ripple' : 'seg ripple'} onClick={() => setMode('landmarks')}>
              <Icon name="bridge" size={17} /><Icon name="capsule" size={17} /><span>교량 · 캡슐</span>
            </button>
            <button className={mode === 'board' ? 'seg seg-on ripple' : 'seg ripple'} onClick={() => setMode('board')}>

          {mode === 'heatmap' && (
            <div className="fade" style={{ display: 'flex', flexWrap: 'wrap', gap: '7px', marginBottom: '12px', alignItems: 'center' }}>
              <span className="faint" style={{ fontSize: '0.7188rem', fontWeight: 600 }}>보기:</span>
              <button className={selectedTeam === null ? 'chip chip-on ripple' : 'chip ripple'} onClick={() => setSelectedTeam(null)}>전체 평균</button>
              {TEAMS.map(t => (
                <button key={t.id} className={selectedTeam === t.id ? 'chip chip-on ripple' : 'chip ripple'} onClick={() => setSelectedTeam(t.id)}
                        style={selectedTeam === t.id ? { background: `linear-gradient(135deg, ${t.color}, ${t.deep})`, boxShadow: `0 5px 15px ${t.color}55` } : null}>
                  {t.id}팀
                </button>
              ))}
            </div>
          )}

          {mode === 'board' && (
            <div className="board-grid rise" style={{ animationDelay: '.18s' }}>
              {TEAMS.map(team => {
                const td = data[team.id] || {};
                const done = Object.keys(td).length;
                const bridges = ZONES.filter(z => td[z.code]?.bridge).length;
                const capsules = ZONES.filter(z => td[z.code]?.capsule).length;
                return (
                  <div key={team.id} className="glass board-card">
                    <div className="board-head">
                      <div className="board-dot" style={{ background: `linear-gradient(150deg, ${team.color}, ${team.deep})` }}>{team.id}</div>
                      <span className="board-name">{team.name}</span>
                      <span className="board-count">{done}/{ZONES.length}</span>
                    </div>
                    <div className="board-bar">
                      <div style={{ width: `${(done / ZONES.length) * 100}%`, background: `linear-gradient(90deg, ${team.color}, ${team.deep})` }} />
                    </div>
                    {/* 각 팀 지도: 방사선 영역 색 + 그 팀이 찾은 교량·캡슐이 함께 들어간다 */}
                    <FloorMap zoneData={data} teamId={team.id} compact uid={`t${team.id}`}
                              markers={(data.markers && data.markers[team.id]) || {}} />
                    {done === 0
                      ? <div className="board-empty">아직 기록 없음</div>
                      : (bridges || capsules) ? (
                          <div className="board-found">
                            {bridges > 0 && <span><Icon name="bridge" size={13} />교량 {bridges}</span>}
                            {capsules > 0 && <span><Icon name="capsule" size={13} />캡슐 {capsules}</span>}
                          </div>

          {mode !== 'board' && (

                      markers={mode === 'landmarks' ? allMarkers : null} />
            {mode === 'heatmap' && (
              <div className="fade" style={{ marginTop: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '0.6875rem' }}>
                <span className="faint" style={{ fontWeight: 600 }}>낮음</span>
                <div style={{ display: 'flex', borderRadius: '999px', overflow: 'hidden', boxShadow: '0 3px 10px rgba(49,73,122,0.2)' }}>
                  {HEAT.map(c => <div key={c} style={{ width: '32px', height: '12px', background: c }} />)}
                </div>
                <span className="faint" style={{ fontWeight: 600 }}>높음 (mSv/h)</span>
              </div>
            )}
            {mode === 'landmarks' && (
              <div className="dim fade" style={{ marginTop: '14px', fontSize: '0.75rem', display: 'grid', gap: '8px' }}>
                <div className="ico-row"><span className="legend-dot" style={{ background: '#1f2937' }}><Icon name="bridge" size={14} /></span>표시된 구역 — 팀들이 교량 발견 체크한 위치</div>
                <div className="ico-row"><span className="legend-dot" style={{ background: '#f59e0b' }}><Icon name="capsule" size={14} /></span>표시된 구역 — 팀들이 캡슐 발견 체크한 위치</div>
              </div>

          {/* 수업 전후 정리용 — 학생 화면에는 두지 않는다 */}
          <button className="btn-glass ripple rise" onClick={onReset}
                  style={{ width: '100%', padding: '12px', marginTop: '18px', fontSize: '0.75rem',
                           color: 'var(--danger)', animationDelay: '.24s' }}>
            전체 데이터 초기화
          </button>

    // ============ 홈 ============
    const HomeView = ({ onSelectTeam, onSelectAdmin }) => (
      <div style={{ padding: '48px 16px 36px', maxWidth: '520px', margin: '0 auto' }}>
        <div className="rise" style={{ textAlign: 'center', marginBottom: '28px' }}>
          <div className="eyebrow" style={{ marginBottom: '10px' }}>Mission 01 · Recon Mapping</div>
          <h1 style={{ fontSize: '1.8125rem', fontWeight: 800, marginBottom: '8px' }}>극한환경 탐사 미션</h1>
          <p className="dim" style={{ margin: 0, fontSize: '0.8438rem' }}>바퀴형 로봇 정찰 · 14개 구역 데이터 매핑</p>
        </div>

        <div className="glass rise" style={{ padding: '20px', marginBottom: '13px', animationDelay: '.08s' }}>
          <p className="faint" style={{ fontSize: '0.7188rem', fontWeight: 700, margin: '0 0 13px' }}>팀을 선택하세요</p>
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(${TEAMS.length}, minmax(0, 1fr))`, gap: '8px' }}>
            {TEAMS.map((team, i) => (
              <button key={team.id} className="team-tile ripple pop" onClick={() => onSelectTeam(team.id)}
                      style={{ ['--team']: team.color, ['--team-deep']: team.deep, ['--team-glow']: team.color + '66', animationDelay: `${140 + i * 55}ms` }}>
                {team.id}
              </button>
            ))}
          </div>
        </div>

        <button className="btn-primary ripple rise ico-row" onClick={onSelectAdmin} style={{ width: '100%', padding: '16px', fontSize: '0.875rem', marginBottom: '10px', animationDelay: '.36s', justifyContent: 'center' }}>
          <Icon name="board" size={18} /><span>강사 화면 (결과 보기)</span>
        </button>

      </div>
    );

    // ============ 메인 앱 ============
    // 배포 식별용. index.html을 고쳐 배포할 때마다 갱신할 것 (캐시 판별용)
    const APP_BUILD = 'b31 · 5 teams';
    const UPDATE_CHECK_MS = 60000;

    function App() {
      const [route, setRoute] = useState(parseHash());
      const [data, setData] = useState({});
      const [loading, setLoading] = useState(true);
      const [connected, setConnected] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        const handleHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      // 새 버전 자동 반영.
      // GitHub Pages가 Cache-Control: max-age=600 을 내려주고 "홈 화면에 추가"로
      // 만든 앱은 더 오래 붙잡기 때문에, 배포해도 태블릿이 옛 화면을 계속 보여준다.
      // 배포본을 캐시 없이 읽어 APP_BUILD가 다르면 새 주소로 다시 연다.
      useEffect(() => {
        let stopped = false;
        const check = async () => {
          if (stopped) return;
          // 입력 창이 열려 있으면 건드리지 않는다 — 학생이 타이핑 중인 값을 날리면 안 된다
          if (document.querySelector('.glass-strong')) return;
          try {
            const res = await fetch(`${location.pathname}?cb=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok || stopped) return;
            const m = (await res.text()).match(/APP_BUILD = '([^']*)'/);
            if (!m || stopped) return;
            const latest = m[1];
            if (latest === APP_BUILD) return;
            // 새 주소로 열어도 여전히 옛 버전이면 무한 새로고침이 되므로 한 번만 시도
            if (sessionStorage.getItem('reloadedFor') === latest) return;
            sessionStorage.setItem('reloadedFor', latest);
            location.replace(`${location.pathname}?v=${encodeURIComponent(latest)}${location.hash}`);
          } catch (e) { /* 오프라인이면 다음 주기에 */ }
        };
        check();
        const t = setInterval(check, UPDATE_CHECK_MS);
        return () => { stopped = true; clearInterval(t); };
      }, []);

      // 실시간 수신(SSE) + 실패 시 폴링 폴백.
      // 스트림은 바뀐 부분만 밀어주므로 3초 폴링보다 오히려 트래픽이 적고,
      // 강사 화면에서 학생 입력이 들어오는 즉시 반영된다.
      useEffect(() => {
        let cancelled = false;
        let es = null, pollTimer = null, firstDataTimer = null;
        let gotData = false;

        const onData = (updater) => {
          if (cancelled) return;
          gotData = true;
          setData(updater);
          setConnected(true);
          setError(null);
          setLoading(false);
        };

        const startPolling = () => {
          if (cancelled || pollTimer) return;
          const poll = async () => {
            try {
              const val = await api.getAll();
              if (!cancelled) {
                setData(val || {});
                setConnected(true);
                setError(null);
                setLoading(false);
              }
            } catch (e) {
              if (!cancelled) {
                setConnected(false);
                setError(e.message);
                setLoading(false);
              }
            }
          };
          poll();
          pollTimer = setInterval(poll, POLL_INTERVAL);
        };

        const stopStream = () => {
          if (firstDataTimer) { clearTimeout(firstDataTimer); firstDataTimer = null; }
          if (es) { es.close(); es = null; }
        };

        if (typeof EventSource !== 'undefined') {
          try {
            es = new EventSource(`${DATABASE_URL}/${DB_PATH}.json`);

            const handle = (merge) => (e) => {
              let msg;
              try { msg = JSON.parse(e.data); } catch (_) { return; }
              if (!msg) return;
              onData(prev => applyStreamPatch(prev, msg.path, msg.data, merge));
            };
            es.addEventListener('put', handle(false));
            es.addEventListener('patch', handle(true));

            es.addEventListener('cancel', () => { stopStream(); startPolling(); });
            es.addEventListener('auth_revoked', () => { stopStream(); startPolling(); });

            es.onerror = () => {
              // EventSource는 스스로 재연결한다. 아직 한 번도 못 받았으면
              // 스트림이 막힌 환경이라고 보고 폴링으로 내려간다.
              if (cancelled) return;
              if (!gotData) { stopStream(); startPolling(); }
              else setConnected(false);
            };

            // 스트림이 조용히 안 열리는 경우 대비
            firstDataTimer = setTimeout(() => {
              if (!cancelled && !gotData) { stopStream(); startPolling(); }
            }, 6000);
          } catch (e) {
            stopStream();
            startPolling();
          }
        } else {
          startPolling();
        }

        return () => {
          cancelled = true;
          stopStream();
          if (pollTimer) clearInterval(pollTimer);
        };
      }, []);

      const handleSave = useCallback(async (teamId, zoneCode, inputData) => {
        await api.setZone(teamId, zoneCode, inputData);
        // 저장 후 즉시 다시 읽어 UI 반영
        try {
          const val = await api.getAll();
          setData(val || {});
        } catch (e) {}
      }, []);

      const handlePlaceProp = useCallback(async (teamId, propId, x, y) => {
        setData(prev => {                     // 스트림보다 먼저 화면에 반영
          const next = { ...prev };
          const mk = { ...(next.markers || {}) };
          mk[teamId] = { ...(mk[teamId] || {}), [propId]: { x, y, ts: Date.now() } };
          next.markers = mk;
          return next;
        });
        try { await api.setMarker(teamId, propId, { x, y, ts: Date.now() }); }
        catch (e) { alert('배치 저장 실패: ' + e.message); }
      }, []);

      const handleRemoveProp = useCallback(async (teamId, propId) => {
        setData(prev => {
          const next = { ...prev };
          const mk = { ...(next.markers || {}) };
          if (mk[teamId]) { mk[teamId] = { ...mk[teamId] }; delete mk[teamId][propId]; }
          next.markers = mk;
          return next;
        });
        try { await api.deleteMarker(teamId, propId); }
        catch (e) { alert('배치 삭제 실패: ' + e.message); }
      }, []);

      const handleReset = async () => {
        if (!confirm('모든 팀의 모든 데이터를 완전히 삭제합니다. 계속?')) return;
        try {
          await api.deleteAll();
          setData({});
        } catch (e) {
          alert('삭제 실패: ' + e.message);
        }
      };

      if (loading) {
        return (
          <div className="loading">
            <div className="loading-spinner"></div>
            <div>데이터 로딩 중...</div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: '100vh' }}>
          <div className="build-tag">{APP_BUILD}</div>
          {/* 정상일 땐 숨긴다. 끊겼을 때만 알리면 충분하고, 그게 실제로 중요한 상태다 */}
          {!connected && (
            <div className="conn-indicator conn-err">
              <span className="conn-dot"></span>연결 끊김
            </div>
          )}
          {route.view === 'home' && (
            <HomeView
              onSelectTeam={(id) => navigate(`/team/${id}`)}
              onSelectAdmin={() => navigate('/admin')}
              />
          )}
          {route.view === 'team' && (
            <TeamView teamId={route.teamId} data={data} onSave={handleSave} onBack={() => navigate('')}
                      onPlaceProp={(id, x, y) => handlePlaceProp(route.teamId, id, x, y)}
                      onRemoveProp={(id) => handleRemoveProp(route.teamId, id)} />
          )}
          {route.view === 'admin' && (
            <AdminView data={data} onBack={() => navigate('')} onReset={handleReset} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- 우클릭 메뉴 / 드래그 차단. preventDefault를 부르므로 passive를 쓰면 안 된다 -->
  <script>
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('dragstart', function (e) { e.preventDefault(); });
  </script>

  <!-- 터치 리플: 이벤트 위임이라 React가 새로 그린 요소에도 그대로 적용됨 -->
  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.addEventListener('pointerdown', function (e) {
        var el = e.target.closest && e.target.closest('.ripple');
        if (!el) return;
        var rect = el.getBoundingClientRect();
        var d = Math.max(rect.width, rect.height);
        var wave = document.createElement('span');
        wave.className = 'ripple-wave';
        wave.style.width = wave.style.height = d + 'px';
        wave.style.left = (e.clientX - rect.left - d / 2) + 'px';
        wave.style.top  = (e.clientY - rect.top  - d / 2) + 'px';
        el.appendChild(wave);
        setTimeout(function () { wave.remove(); }, 640);
      }, { passive: true });
    })();
  </script>
</body>
</html>
